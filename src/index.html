<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surd</title>
<meta name="description" content="Surd — a fast reference and practice tool.">
<!-- lime square + radical, drawn as a path so it never depends on a system font -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c2f04a'/%3E%3Cpath d='M4 17l5 6.5L17.5 6H29' fill='none' stroke='%230a0a0c' stroke-width='3.2'/%3E%3C/svg%3E">
<style>/*STYLE*/</style>
</head>
<body>

<header id="bar">
  <div id="bar-left">
    <div class="brand" title="Surd">surd</div>
    <nav id="tabs">
      <button class="tab on" data-tab="games">Games</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
  <div id="search">
    <svg id="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="9" cy="9" r="6"/><path d="m13.5 13.5 3.5 3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false"
           aria-label="Search games">
    <kbd id="search-key">/</kbd>
  </div>
  <div id="bar-end"></div>
</header>

<main>
  <section id="view-games" class="view on">
    <div id="hero">
      <div id="hero-art"></div>
      <div id="hero-body">
        <h1 id="hero-title"></h1>
        <p id="hero-meta"></p>
        <div id="hero-actions">
          <button id="hero-play" class="btn primary">Play</button>
          <button id="hero-rand" class="btn">Random game</button>
        </div>
        <div id="hero-dots" role="tablist" aria-label="Featured games"></div>
      </div>
      <button id="hero-prev" class="hero-arrow" aria-label="Previous featured game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button id="hero-next" class="hero-arrow" aria-label="Next featured game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>

    <div id="crumb" hidden>
      <button id="crumb-back" class="btn">&larr; All games</button>
      <strong id="crumb-title"></strong>
    </div>
    <div id="tags" role="group" aria-label="Filters"></div>
    <div id="grid" role="list"></div>
    <p id="empty" hidden>Nothing matches that.</p>
  </section>

  <section id="view-settings" class="view">
    <h2>Cloaking</h2>
    <label class="row">
      <span>Tab title</span>
      <input id="s-title" type="text" placeholder="Surd" autocomplete="off">
    </label>
    <label class="row">
      <span>Tab icon URL</span>
      <input id="s-icon" type="text" placeholder="https://…/favicon.ico" autocomplete="off">
    </label>
    <div class="row">
      <span>Open in about:blank</span>
      <button id="s-blank" class="btn">Launch cloaked</button>
    </div>

    <h2>Mirror</h2>
    <label class="row">
      <span>Load games from</span>
      <select id="s-mirror"></select>
    </label>

    <h2>Panic key</h2>
    <div class="row">
      <span>Key</span>
      <button id="s-panickey" class="btn keycap"></button>
    </div>
    <label class="row">
      <span>Redirects to</span>
      <input id="s-panic" type="text" placeholder="https://classroom.google.com" autocomplete="off">
    </label>

    <h2>Data</h2>
    <div class="row">
      <span>Clear favorites, history and settings</span>
      <button id="s-clear" class="btn danger icon" title="Clear all data" aria-label="Clear all data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button>
    </div>
    <p class="note" id="build"></p>
  </section>
</main>

<footer id="foot"><span id="foot-count"></span></footer>

<div id="player" hidden>
  <div id="player-bar">
    <button id="p-back" class="btn">&larr; Back</button>
    <strong id="p-title"></strong>
    <small id="p-by"></small>
    <span class="spacer"></span>
    <button id="p-fav" class="btn" title="Favorite">&#9734;</button>
    <button id="p-full" class="btn">Fullscreen</button>
  </div>
  <iframe id="p-frame" title="Game" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
</div>

<script>/*GAMES*/</script>
<script>/*APP*/</script>
</body>
</html>
